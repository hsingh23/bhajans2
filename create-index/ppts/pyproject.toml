[project]
name = "songbook-generator"
version = "1.1.0"
description = "Convert PPTX song files to PDF songbook with TOC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.21",
    "reportlab>=4.0.0",
    "lxml>=4.9.0",
]

[project.scripts]
songbook = "songbook_generator:main"
download-fonts = "download_fonts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]